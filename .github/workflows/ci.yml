name: CI

on:
  push:
    branches:
      - main
      - halloween
      - christmas
      - spring
      - summer
      - autumn
  pull_request:
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # The built site in Chromium, WebKit and Firefox at five screens (playwright.config.ts): the page, its accessibility,
  # the still page where a frame throws, and a picture of the garden under ?test compared with the one kept for that
  # engine. A runner without the pictures yet writes them and uploads them, to be read and committed.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Build
        run: bun run build

      - name: Browser checks
        run: |
          if [ -d test/e2e/__screenshots__/linux ]; then bun run e2e; else bun run e2e --update-snapshots=all; fi

      - name: Keep the pictures and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            test/e2e/__screenshots__/linux
            test-results
          if-no-files-found: ignore

  # Lighthouse budgets on the built site, the phone form and the desktop form (lighthouserc.cjs).
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Budgets
        env:
          LHCI_FORM: ${{ matrix.form }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.form }}
          path: .lighthouseci
          if-no-files-found: ignore

  # A season branch may change only its own folders (docs/seasons.md).
  scope:
    if: github.event_name == 'pull_request' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Season stays in its folders
        run: node tools/season-scope.mjs
