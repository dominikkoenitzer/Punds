name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
